name: refresh harian

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 0-5"   # 23:00 UTC Min–Jum = 06:00 WIB Sen–Sab

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Jakarta
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh sumber data (scrape harga Δ + fetch cuaca & kurs)
        run: python scripts/refresh_sumber_data.py

      - name: Jalankan pipeline (mode cepat — pakai model tersimpan)
        run: bash run_pipeline.sh --cepat

      - name: Sanity check — data dashboard tidak basi
        run: |
          python - <<'PY'
          import json, sys, datetime as dt
          m = json.load(open("dashboard_data/meta.json"))
          terakhir = dt.date.fromisoformat(m["tanggal_data_terakhir"])
          umur = (dt.date.today() - terakhir).days
          print(f"tanggal_data_terakhir={terakhir}  umur={umur} hari")
          if umur > 3:
              sys.exit(f"ABORT: data dashboard basi ({umur} hari) — scrape kemungkinan gagal")
          PY

      - name: Commit hasil ke example_scrap
        run: |
          git config user.name  "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add data models dashboard_data
          git diff --cached --quiet || git commit -m "data: refresh harian $(date -u +%F)"
          # main bisa sudah maju selama job berjalan (commit manusia / run lain).
          # Rebase dulu, jangan biarkan push ditolak dengan pesan git mentah.
          if ! git pull --rebase --autostash origin main; then
            echo "::error::rebase ke origin/main gagal — hasil run ini bentrok dengan commit terbaru. Selesaikan konflik manual atau jalankan ulang workflow."
            exit 1
          fi
          if ! git push origin HEAD:main; then
            echo "::error::push ke main ditolak — remote berubah lagi selama job berjalan. Jalankan ulang workflow; jangan paksa push."
            exit 1
          fi
