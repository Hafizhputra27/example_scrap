name: refresh harian

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 0-5"   # 23:00 UTC Min–Jum = 06:00 WIB Sen–Sab

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Jakarta
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh sumber data (scrape harga Δ + fetch cuaca & kurs)
        run: python scripts/refresh_sumber_data.py

      - name: Jalankan pipeline (mode cepat — pakai model tersimpan)
        run: bash run_pipeline.sh --cepat

      - name: Sanity check — data dashboard tidak basi
        run: |
          python - <<'PY'
          import json, sys, datetime as dt
          m = json.load(open("dashboard_data/meta.json"))
          terakhir = dt.date.fromisoformat(m["tanggal_data_terakhir"])
          umur = (dt.date.today() - terakhir).days
          print(f"tanggal_data_terakhir={terakhir}  umur={umur} hari")
          if umur > 3:
              sys.exit(f"ABORT: data dashboard basi ({umur} hari) — scrape kemungkinan gagal")
          PY

      - name: Commit hasil ke example_scrap
        run: |
          git config user.name  "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add data models dashboard_data
          git diff --cached --quiet || git commit -m "data: refresh harian $(date -u +%F)"
          git push

      - name: Push 8 JSON ke patani-dashboard
        env:
          TOKEN: ${{ secrets.DASHBOARD_PUSH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::secret DASHBOARD_PUSH_TOKEN belum diset — lihat docs/auto-refresh.md"
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Hafizhputra27/patani-dashboard" dash
          cp dashboard_data/*.json dash/public/data/
          cd dash
          git config user.name  "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet && { echo "tidak ada perubahan JSON — skip"; exit 0; }
          git commit -m "data: refresh $(date -u +%F) (auto)"
          git push
